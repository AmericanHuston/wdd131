<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reviews</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
      <h1>Kids Read For Fun</h1>
      <nav aria-label="main menu">
        <hr>
        <ul class="main-nav">
          <li><a href="#">About</a></li>
          <li><a href="#">Archive</a></li>
          <li><a href="#">Search</a></li>
        </ul>
        <hr>
      </nav>
  </header>
  <main id="main-content" role="main">
    <hr id="mobile-only">
    <section id="book-list" aria-label="Book Reviews">
      <article class="book">
        <div id="meta">
            <p><i>July 5, 2022</i></p>
            <p>10-14</p>
            <p>Fantasy</p>
            <p><span aria-label="4 out of 5 stars" role="img">⭐⭐⭐⭐</span></p>
        </div>
        <div id="book-break"></div>
        <div id="main-book">
        <h2>Septimus Heap Book One: Magyk</h2>
            <img src="images/Magkycover2.jpg" alt="An old book with a lock on the right hand side">
            <p id='desc'>
                If you enjoy stories about seventh sons of seventh sons 
                and magyk this book is for you.
            </p>
        </div>
      </article>
    </section>
    <hr>
  </main>
  <footer>
    <p>Jane Doe</p>
  </footer>
</body>
</html>
