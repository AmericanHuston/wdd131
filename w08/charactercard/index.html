<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Noah Sederstrom">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="A quick character card game">
    <meta property="og:url" content="https://americanhuston.github.io/wdd131/">
    <meta property="og:image" content="https://americanhuston.github.io/wdd131/w08/charactercard/images/image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="A quick character card game">
    <meta name="twitter:image" content="https://americanhuston.github.io/wdd131/w08/charactercard/images/image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="https://americanhuston.github.io/wdd131/w08/charactercard/images/image.png">

    <title>Character Card</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script defer src="index.js"></script>
</head>
<body>
    <div class="card">
        <img class="image" src="./images/image.png" alt="Snortleblat">
        <h1 class="name">Snortleblat</h1>
        <div class="stats">
            <p>Class: [class]</p>
            <p>Level: [level]</p>
            <p>Health: [health]</p>
        </div>
        <div class="buttons">
            <button id="attacked">Attacked</button>
            <button id="levelUp">Level Up</button>
        </div>
    </div>
</body>
</html>
